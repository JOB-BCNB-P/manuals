<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>คู่มือ APIS งานวิชาการ</title>
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: a reading desk — slim toolbar, the book centred on a soft surface, page strip below; contents slide in from the left */
:root{
  --bg:#eef1f8; --desk:#e3e8f4; --surface:#ffffff; --fg:#1d2340; --muted:#5d6587;
  --line:#d3d9ea; --accent:#3d5bd9; --accent-soft:#e3e8ff; --pink:#e04fa8;
  --shadow:0 18px 40px -18px rgba(29,35,64,.45);
  --display:"Mitr","IBM Plex Sans Thai",system-ui,sans-serif;
  --body:"IBM Plex Sans Thai","Sarabun",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14172a; --desk:#1b1f36; --surface:#232842; --fg:#e8ebfa; --muted:#a2a9cc;
  --line:#333a5e; --accent:#8ea2ff; --accent-soft:#2c3462; --pink:#f27cc4;
  --shadow:0 18px 40px -16px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14172a; --desk:#1b1f36; --surface:#232842; --fg:#e8ebfa; --muted:#a2a9cc;
  --line:#333a5e; --accent:#8ea2ff; --accent-soft:#2c3462; --pink:#f27cc4;
  --shadow:0 18px 40px -16px rgba(0,0,0,.7); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;
  display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.bar{display:flex;align-items:center;gap:12px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--surface);border-bottom:1px solid var(--line);flex:none}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand b{font-family:var(--display);font-weight:500;font-size:1.05rem;line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);
  border-radius:10px;padding:7px 12px;font-size:.88rem;white-space:nowrap}
.tbtn:hover{border-color:var(--accent);color:var(--accent)}
.tbtn svg{width:18px;height:18px;flex:none}

.desk{flex:1;min-height:0;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 40%,var(--desk),var(--bg) 75%);
  padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#bookWrap{position:relative;max-width:100%;perspective:2600px;touch-action:pan-y}
#book{position:relative;width:100%;height:100%;transition:transform .45s ease;filter:drop-shadow(0 16px 26px rgba(20,24,50,.3))}
.slot{position:absolute;top:0;height:100%;overflow:hidden;background:transparent}
.slot img,.leaf img{width:100%;height:100%;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none}
.slot.l{left:0}.slot.r{right:0}
.slot.l img{border-radius:6px 0 0 6px}.slot.r img{border-radius:0 6px 6px 0}
.single .slot{left:0;right:0;width:100%!important}.single .slot img{border-radius:6px}
.spine{position:absolute;top:0;bottom:0;left:50%;width:36px;transform:translateX(-50%);pointer-events:none;z-index:3;
  background:linear-gradient(90deg,transparent,rgba(0,0,0,.16) 45%,rgba(0,0,0,.22) 50%,rgba(0,0,0,.16) 55%,transparent)}
.single .spine,.cover .spine{display:none}
.leaf{position:absolute;top:0;height:100%;transform-style:preserve-3d;z-index:4;transition:transform .7s cubic-bezier(.45,.05,.3,1)}
.leaf .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:#fff}
.leaf .back{transform:rotateY(180deg)}
.leaf .face::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .7s}
.leaf.fwd{transform-origin:left center}.leaf.bwd{transform-origin:right center}
.leaf.fwd .front::after{background:linear-gradient(90deg,rgba(0,0,0,.25),transparent 60%)}
.leaf.bwd .front::after{background:linear-gradient(270deg,rgba(0,0,0,.25),transparent 60%)}
.leaf.go .face::after{opacity:1}
.hit{position:absolute;top:0;bottom:0;width:22%;z-index:6;cursor:pointer;background:none;border:0}
.hit.l{left:0}.hit.r{right:0}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;
  border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;z-index:5}
.nav:hover{color:var(--accent);border-color:var(--accent)}
.nav:disabled{opacity:.35;cursor:default}
.nav svg{width:22px;height:22px}
#prev{left:max(10px,env(safe-area-inset-left,0px))} #next{right:max(10px,env(safe-area-inset-right,0px))}

.foot{flex:none;background:var(--surface);border-top:1px solid var(--line);padding-block:8px 10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.caption{display:flex;align-items:baseline;gap:10px;justify-content:center;flex-wrap:wrap;text-align:center}
.caption .step{font-family:var(--display);font-weight:500;color:var(--accent)}
.caption .ctext{color:var(--fg)}
.caption .count{color:var(--muted);font-size:.82rem;font-variant-numeric:tabular-nums}
.strip{display:flex;gap:8px;overflow-x:auto;padding-block:8px 2px;scrollbar-width:thin;justify-content:safe center}
.thumb{flex:none;width:44px;aspect-ratio:1076/1521;border-radius:4px;border:2px solid transparent;padding:0;
  background:var(--desk);overflow:hidden;opacity:.7;transition:opacity .15s,border-color .15s}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb:hover{opacity:1}
.thumb[aria-current="true"]{border-color:var(--accent);opacity:1}

/* contents drawer */
.scrim{position:fixed;inset:0;background:rgba(10,12,28,.45);z-index:20}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(360px,88vw);background:var(--surface);z-index:21;
  box-shadow:var(--shadow);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);
  transform:translateX(-102%);transition:transform .25s ease}
.drawer.open{transform:none}
.drawer header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px;border-bottom:1px solid var(--line)}
.drawer h2{font-family:var(--display);font-weight:500;font-size:1.15rem;margin:0}
.toc{list-style:none;margin:0;padding:8px;overflow-y:auto}
.toc button{width:100%;display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:start;text-align:left;
  background:none;border:0;border-radius:10px;padding:9px 10px}
.toc button:hover{background:var(--accent-soft)}
.toc button[aria-current="true"]{background:var(--accent-soft)}
.toc .n{font-family:var(--display);font-size:.82rem;color:var(--pink);padding-top:2px;letter-spacing:.02em}
.toc .t{font-size:.92rem;line-height:1.45;min-width:0}
.toc .p{display:block;font-size:.75rem;color:var(--muted)}
.drawer .note{margin:auto 18px 16px;padding:12px 14px;border-radius:10px;background:var(--accent-soft);font-size:.84rem;line-height:1.55}
.drawer .note b{color:var(--pink);font-weight:600}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:640px){
  .tbtn .lbl{display:none} .tbtn{padding:7px 9px}
  .nav{width:38px;height:38px;top:auto;bottom:10px;transform:none}
  .thumb{width:32px}
  .caption{gap:2px 8px;line-height:1.45}
  .caption .ctext{order:3;width:100%;font-size:.85rem}
}
@media (prefers-reduced-motion:reduce){#book,.drawer,.thumb,.leaf,.leaf .face::after{transition:none}}
</style>

<header class="bar">
  <button class="tbtn" id="tocBtn" aria-controls="drawer" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    <span class="lbl">สารบัญ</span>
  </button>
  <div class="brand">
    <b>คู่มือการใช้งานระบบสำรวจความต้องการจัดซื้อ</b>
    <span>APIS · งานวิชาการ วิทยาลัยพยาบาลบรมราชชนนี กรุงเทพ</span>
  </div>
  <button class="tbtn" id="fsBtn" title="เต็มจอ">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    <span class="lbl">เต็มจอ</span>
  </button>
</header>

<main class="desk" id="desk">
  <button class="nav" id="prev" aria-label="หน้าก่อนหน้า"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div id="bookWrap"><div id="book"></div></div>
  <button class="nav" id="next" aria-label="หน้าถัดไป"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
</main>

<footer class="foot">
  <div class="caption" aria-live="polite">
    <span class="step" id="capStep"></span><span class="ctext" id="capText"></span><span class="count" id="capCount"></span>
  </div>
  <div class="strip" id="strip"></div>
</footer>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" aria-label="สารบัญ">
  <header><h2>สารบัญ</h2>
    <button class="tbtn" id="closeToc" aria-label="ปิดสารบัญ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </header>
  <ol class="toc" id="toc"></ol>
  <div class="note"><b>ครุภัณฑ์ต้องกรอกคุณลักษณะเฉพาะ</b><br>ระบุรายละเอียดให้ครบ เพื่อใช้ประกอบการจัดทำรายละเอียดคุณลักษณะในการจัดซื้อ</div>
</aside>

const src=i=>IMGS[i];
const $=id=>document.getElementById(id);
const desk=$("desk"),wrap=$("bookWrap"),book=$("book");
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let cur=0,busy=false,spreadMode=true,pw=0;

// preload
PAGES.forEach((_,i)=>{const im=new Image();im.src=src(i)});

PAGES.forEach((p,i)=>{
  const b=document.createElement("button");b.className="thumb";b.title=(i+1)+" · "+p.s;
  b.setAttribute("aria-label","ไปหน้า "+(i+1));
  b.innerHTML='<img loading="lazy" alt="" src="'+src(i)+'">';b.onclick=()=>go(i);$("strip").appendChild(b);
  const li=document.createElement("li");const tb=document.createElement("button");
  tb.innerHTML='<span class="n">'+p.s+'</span><span class="t">'+p.t+'<span class="p">หน้า '+(i+1)+'</span></span>';
  tb.onclick=()=>{closeToc();go(i)};li.appendChild(tb);$("toc").appendChild(li);
});

const img=i=>(i==null||i<0||i>=N)?"":'<img alt="'+PAGES[i].s+': '+PAGES[i].a+'" src="'+src(i)+'">';
const spOf=i=>Math.ceil(i/2);
const spPages=k=>[k>0?2*k-1:null,2*k<N?2*k:null];

function layout(){
  const cs=getComputedStyle(desk);
  const h=desk.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  const w0=desk.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  spreadMode=w0>=760;
  const w=w0-(spreadMode?120:0), n=spreadMode?2:1;
  pw=Math.floor(Math.max(160,Math.min(w/n,h*R)));
  wrap.style.width=(pw*n)+"px";wrap.style.height=Math.floor(pw/R)+"px";
  wrap.classList.toggle("single",!spreadMode);
  render();
}
function slot(cls,i){return i==null?"":'<div class="slot '+cls+'" style="width:'+pw+'px">'+img(i)+'</div>'}
function render(){
  if(spreadMode){
    const k=spOf(cur),[l,r]=spPages(k);
    book.innerHTML=slot("l",l)+slot("r",r)+'<div class="spine"></div>';
    wrap.classList.toggle("cover",k===0||r==null);
    book.style.transform=k===0?"translateX(-"+(pw/2)+"px)":(r==null?"translateX("+(pw/2)+"px)":"none");
  }else{
    wrap.classList.remove("cover");book.style.transform="none";
    book.innerHTML=slot("r",cur);
  }
  book.insertAdjacentHTML("beforeend",'<button class="hit l" aria-label="หน้าก่อนหน้า" tabindex="-1"></button><button class="hit r" aria-label="หน้าถัดไป" tabindex="-1"></button>');
  book.querySelector(".hit.l").onclick=prev;book.querySelector(".hit.r").onclick=next;
  update();
}
function update(){
  const p=PAGES[cur];
  $("capStep").textContent=p.s;$("capText").textContent=p.t;
  let label="หน้า "+(cur+1);
  if(spreadMode){const [l,r]=spPages(spOf(cur));if(l!=null&&r!=null)label="หน้า "+(l+1)+"–"+(r+1)}
  $("capCount").textContent=label+" / "+N;
  const th=document.querySelectorAll(".thumb"),tc=document.querySelectorAll(".toc button");
  const vis=spreadMode?spPages(spOf(cur)):[cur];
  th.forEach((t,k)=>t.setAttribute("aria-current",vis.includes(k)));
  tc.forEach((t,k)=>t.setAttribute("aria-current",k===cur));
  const at=th[cur];if(at)at.scrollIntoView({block:"nearest",inline:"center",behavior:reduce?"auto":"smooth"});
  $("prev").disabled=cur<=0;
  $("next").disabled=spreadMode?spOf(cur)>=spOf(N-1):cur>=N-1;
  try{history.replaceState(null,"","#p"+(cur+1))}catch(e){}
}
function animate(leafHTML,cls,style,from,to,under,after){
  if(reduce){after();return}
  busy=true;
  book.querySelectorAll(".slot").forEach(s=>s.remove());
  book.insertAdjacentHTML("afterbegin",under);
  const leaf=document.createElement("div");leaf.className="leaf "+cls;leaf.style.cssText=style+";transform:rotateY("+from+"deg)";
  leaf.innerHTML=leafHTML;book.appendChild(leaf);
  leaf.getBoundingClientRect();
  requestAnimationFrame(()=>{leaf.classList.add("go");leaf.style.transform="rotateY("+to+"deg)"});
  setTimeout(()=>{busy=false;after()},DUR+20);
}
function face(c,i){return '<div class="face '+c+'">'+img(i)+'</div>'}
function go(target){
  target=Math.max(0,Math.min(N-1,target));
  if(busy)return;
  if(spreadMode){
    const k=spOf(cur),t=spOf(target);
    if(k===t){cur=target;update();return}
    const [l,r]=spPages(k),[tl,tr]=spPages(t);
    const done=()=>{cur=target;render()};
    if(t>k){
      book.style.transform="none";
      animate(face("front",r)+face("back",tl),"fwd","left:"+pw+"px;width:"+pw+"px",0,-180,slot("l",l)+slot("r",tr),done);
    }else{
      if(t===0)book.style.transform="translateX(-"+(pw/2)+"px)";
      animate(face("front",l)+face("back",tr),"bwd","left:0;width:"+pw+"px",0,180,slot("l",tl)+slot("r",r),done);
    }
  }else{
    if(target===cur)return;
    const done=()=>{cur=target;render()};
    if(target>cur) animate(face("front",cur)+'<div class="face back"></div>',"fwd","left:0;width:"+pw+"px",0,-180,slot("r",target),done);
    else animate(face("front",target)+'<div class="face back"></div>',"fwd","left:0;width:"+pw+"px",-180,0,slot("r",cur),done);
  }
}
function next(){if(spreadMode){const [,r]=spPages(spOf(cur)+1);if(r!=null||spOf(cur)<spOf(N-1))go(2*(spOf(cur)+1)-1)}else go(cur+1)}
function prev(){if(spreadMode){const k=spOf(cur);if(k>0)go(k-1===0?0:2*(k-1)-1)}else go(cur-1)}

$("prev").onclick=prev;$("next").onclick=next;
document.addEventListener("keydown",e=>{
  if($("drawer").classList.contains("open")){if(e.key==="Escape")closeToc();return}
  if(e.key==="ArrowRight"||e.key==="PageDown"||e.key===" "){e.preventDefault();next()}
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();prev()}
  else if(e.key==="Home")go(0);else if(e.key==="End")go(N-1);
});
// swipe
let sx=null;
wrap.addEventListener("pointerdown",e=>{sx=e.clientX});
wrap.addEventListener("pointerup",e=>{if(sx==null)return;const d=e.clientX-sx;sx=null;if(Math.abs(d)>40){d<0?next():prev()}});
// contents
function openToc(){$("drawer").classList.add("open");$("scrim").hidden=false;$("tocBtn").setAttribute("aria-expanded","true");$("closeToc").focus()}
function closeToc(){$("drawer").classList.remove("open");$("scrim").hidden=true;$("tocBtn").setAttribute("aria-expanded","false")}
$("tocBtn").onclick=openToc;$("closeToc").onclick=closeToc;$("scrim").onclick=closeToc;
$("fsBtn").onclick=()=>{try{if(document.fullscreenElement)document.exitFullscreen();else{const r=document.documentElement.requestFullscreen();if(r&&r.catch)r.catch(()=>{})}}catch(e){}};

const m=/^#p(\d+)$/.exec(location.hash||"");if(m)cur=Math.min(N-1,Math.max(0,+m[1]-1));
let rt;window.addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{if(!busy)layout()},150)});
layout();
})();
